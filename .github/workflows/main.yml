name: Android_APK_Yaratish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17-ni sozlash
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradlew-ga ruxsat berish
        run: chmod +x gradlew

      - name: APK-ni yig'ish (Assemble Debug)
        # Faqat eng zarur buyruqni qoldiramiz
        run: ./gradlew assembleDebug

      - name: Tayyor APK-ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TubeMe-Build
          path: app/build/outputs/apk/debug/*.apk
          
