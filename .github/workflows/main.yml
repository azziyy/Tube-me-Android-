name: Android_APK_Yaratish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17-ni sozlash
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Tozalash va Majburiy Build
        run: |
          # Buzilgan gradlew fayllarini o'chiramiz
          rm -f gradlew gradlew.bat
          
          # Tizimdagi toza gradle orqali keshni tozalab, APK yig'amiz
          gradle clean assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: APK-ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TubeMe-Tayyor-APK
          path: app/build/outputs/apk/debug/*.apk
          
