name: Android_APK_Yaratish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17-ni sozlash
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Majburiy toza build
        # Bu qadam buzilgan fayllarni o'chirib, xatolarni chetlab o'tadi
        run: |
          rm -f gradlew
          rm -f gradlew.bat
          gradle assembleDebug --no-daemon --no-configure-on-demand -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: APK-ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TubeMe-Tayyor-APK
          path: app/build/outputs/apk/debug/*.apk
          
